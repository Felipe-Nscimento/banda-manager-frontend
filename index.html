<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Praizy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg-deep:       #050810;
  --bg-base:       #080c18;
  --bg-surface:    #0d1225;
  --bg-elevated:   #111830;
  --bg-hover:      #161f3a;
  --border-subtle: rgba(255,255,255,0.05);
  --border-soft:   rgba(255,255,255,0.09);
  --border-medium: rgba(255,255,255,0.14);
  --border-strong: rgba(255,255,255,0.22);
  --text-primary:   #e8edf8;
  --text-secondary: #7a85a3;
  --text-muted:     #3d4560;
  --text-inverse:   #050810;
  --brand-blue:    #2d7cf6;
  --brand-cyan:    #00c8e0;
  --brand-light:   #60b8ff;
  --brand-glow:    rgba(45,124,246,0.18);
  --grad-brand:    linear-gradient(135deg, #2d7cf6, #00c8e0);
  --grad-brand-v:  linear-gradient(180deg, #2d7cf6, #00c8e0);
  --grad-glow:     radial-gradient(ellipse at 50% 0%, rgba(45,124,246,0.15) 0%, transparent 60%);
  --success:    #22d07a; --success-bg: rgba(34,208,122,0.1);
  --warning:    #f0b429; --warning-bg: rgba(240,180,41,0.1);
  --danger:     #f05252; --danger-bg:  rgba(240,82,82,0.1);
  --info:       #2d7cf6; --info-bg:    rgba(45,124,246,0.1);
  --font-display: 'Syne', sans-serif;
  --font-body:    'Inter', sans-serif;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px;
  --radius-xl: 24px; --radius-full: 9999px;
  --shadow-glow: 0 0 24px rgba(45,124,246,0.25);
  --shadow-lg:   0 8px 32px rgba(0,0,0,0.6);
  --transition: 0.18s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;scroll-behavior:smooth;}
body{font-family:var(--font-body);background:var(--bg-base);color:var(--text-primary);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:var(--grad-glow),radial-gradient(ellipse at 80% 80%,rgba(0,200,224,0.06) 0%,transparent 50%);pointer-events:none;z-index:0;}

/* ── AUTH PAGES ── */
.auth-page{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem;background:var(--bg-base);}
.auth-page::before{content:'';position:absolute;inset:0;background:var(--grad-glow),radial-gradient(ellipse at 80% 80%,rgba(0,200,224,0.06) 0%,transparent 50%);pointer-events:none;}
.auth-box{position:relative;z-index:1;width:100%;max-width:420px;animation:fadeUp 0.3s ease;}
.auth-logo{text-align:center;margin-bottom:2rem;}
.auth-logo-icon{width:56px;height:56px;border-radius:var(--radius-lg);background:var(--grad-brand);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 12px;box-shadow:var(--shadow-glow);}
.auth-logo-text{font-family:var(--font-display);font-size:32px;font-weight:800;background:var(--grad-brand);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px;}
.auth-logo-sub{font-size:13px;color:var(--text-muted);margin-top:2px;}
.auth-card{background:var(--bg-surface);border:1px solid var(--border-soft);border-radius:var(--radius-xl);padding:2rem;position:relative;overflow:hidden;}
.auth-card::before{content:'';position:absolute;top:0;left:24px;right:24px;height:1px;background:var(--grad-brand);opacity:0.5;}
.auth-title{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--text-primary);margin-bottom:4px;}
.auth-subtitle{font-size:13px;color:var(--text-secondary);margin-bottom:1.5rem;}
.auth-footer{text-align:center;margin-top:1.25rem;font-size:13px;color:var(--text-secondary);}
.auth-footer a{color:var(--brand-light);text-decoration:none;font-weight:500;cursor:pointer;}
.auth-footer a:hover{color:var(--brand-cyan);}
.auth-divider{display:flex;align-items:center;gap:12px;margin:1.25rem 0;color:var(--text-muted);font-size:12px;}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border-subtle);}

/* ── HEADER ── */
.app-header{position:sticky;top:0;z-index:100;height:60px;background:rgba(8,12,24,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;padding:0 1.5rem;gap:1rem;}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo-icon{width:34px;height:34px;border-radius:var(--radius-md);background:var(--grad-brand);display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:var(--shadow-glow);flex-shrink:0;}
.logo-text{font-family:var(--font-display);font-size:20px;font-weight:800;background:var(--grad-brand);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.5px;}
.logo-sub{font-size:11px;color:var(--text-muted);display:none;}
@media(min-width:600px){.logo-sub{display:block;}}
.nav{display:flex;gap:2px;margin-left:auto;align-items:center;}
.nav-btn{background:none;border:none;color:var(--text-secondary);font-family:var(--font-body);font-size:13px;font-weight:500;padding:7px 14px;border-radius:var(--radius-md);cursor:pointer;display:flex;align-items:center;gap:6px;transition:all var(--transition);white-space:nowrap;}
.nav-btn:hover{background:var(--bg-hover);color:var(--text-primary);}
.nav-btn.active{background:var(--brand-glow);color:var(--brand-light);border:1px solid rgba(45,124,246,0.3);}
.user-chip{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:var(--radius-full);background:var(--bg-elevated);border:1px solid var(--border-soft);cursor:default;margin-left:8px;}
.user-chip-avatar{width:26px;height:26px;border-radius:50%;background:var(--grad-brand);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:11px;font-weight:700;color:#fff;flex-shrink:0;}
.user-chip-name{font-size:12px;font-weight:500;color:var(--text-primary);max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.btn-logout{background:none;border:none;color:var(--text-muted);font-size:12px;cursor:pointer;padding:5px 8px;border-radius:var(--radius-sm);transition:all var(--transition);}
.btn-logout:hover{color:var(--danger);background:var(--danger-bg);}

/* ── LAYOUT ── */
.container{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:2rem 1.5rem;}
.section{display:none;animation:fadeUp 0.25s ease;}
.section.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.page-header{margin-bottom:2rem;}
.page-header h2{font-family:var(--font-display);font-size:clamp(22px,4vw,30px);font-weight:700;color:var(--text-primary);letter-spacing:-0.5px;line-height:1.2;}
.page-header p{font-size:13px;color:var(--text-secondary);margin-top:4px;}

/* ── CARD ── */
.card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:1.5rem;margin-bottom:1rem;position:relative;overflow:hidden;transition:border-color var(--transition);}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(45,124,246,0.4),transparent);opacity:0;transition:opacity var(--transition);}
.card:hover::before{opacity:1;}
.card-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);margin-bottom:1rem;display:flex;align-items:center;gap:8px;}
.card-label::after{content:'';flex:1;height:1px;background:var(--border-subtle);}

/* ── FORM ── */
.form-group{margin-bottom:1rem;}
.form-label{display:block;font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:6px;letter-spacing:0.02em;}
.form-input,.form-select{width:100%;background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:var(--radius-md);color:var(--text-primary);font-family:var(--font-body);font-size:14px;padding:10px 14px;outline:none;transition:all var(--transition);-webkit-appearance:none;appearance:none;}
.form-input::placeholder{color:var(--text-muted);}
.form-input:focus,.form-select:focus{border-color:var(--brand-blue);background:var(--bg-hover);box-shadow:0 0 0 3px rgba(45,124,246,0.12);}
.form-input.error{border-color:var(--danger);box-shadow:0 0 0 3px rgba(240,82,82,0.12);}
.form-error{font-size:12px;color:var(--danger);margin-top:5px;display:none;}
.form-error.show{display:block;}
.form-select option{background:var(--bg-elevated);}
.form-row{display:flex;gap:12px;flex-wrap:wrap;}
.form-row .form-group{flex:1;min-width:140px;}
.input-addon{display:flex;gap:8px;}
.input-addon .form-input{flex:1;}
.input-password{position:relative;}
.input-password .form-input{padding-right:44px;}
.btn-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:17px;padding:2px;transition:color var(--transition);}
.btn-eye:hover{color:var(--text-primary);}

/* ── BOTÕES ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:var(--font-body);font-size:13px;font-weight:500;padding:9px 18px;border-radius:var(--radius-md);cursor:pointer;border:none;transition:all var(--transition);white-space:nowrap;line-height:1;position:relative;overflow:hidden;}
.btn:active{transform:scale(0.98);}
.btn:disabled{opacity:0.4;cursor:not-allowed;pointer-events:none;}
.btn-primary{background:var(--grad-brand);color:#fff;box-shadow:0 2px 12px rgba(45,124,246,0.35);font-weight:600;}
.btn-primary:hover{box-shadow:0 4px 20px rgba(45,124,246,0.5);}
.btn-full{width:100%;padding:12px 18px;font-size:14px;}
.btn-secondary{background:var(--bg-elevated);color:var(--text-primary);border:1px solid var(--border-soft);}
.btn-secondary:hover{border-color:var(--border-medium);}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid transparent;}
.btn-ghost:hover{background:var(--bg-elevated);color:var(--text-primary);}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(240,82,82,0.2);}
.btn-danger:hover{background:rgba(240,82,82,0.18);}
.btn-edit{background:var(--info-bg);color:var(--brand-light);border:1px solid rgba(45,124,246,0.2);}
.btn-edit:hover{background:rgba(45,124,246,0.18);}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:var(--radius-sm);}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:3px 9px;border-radius:var(--radius-full);white-space:nowrap;}
.badge-rm{cursor:pointer;opacity:0.5;font-size:14px;line-height:1;transition:opacity var(--transition);}
.badge-rm:hover{opacity:1;}
.badges-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.badge-instrumento{background:rgba(45,124,246,0.12);color:var(--brand-light);border:1px solid rgba(45,124,246,0.2);}
.badge-vocal{background:rgba(0,200,224,0.1);color:#4dd9ec;border:1px solid rgba(0,200,224,0.2);}
.badge-outro{background:rgba(240,180,41,0.1);color:var(--warning);border:1px solid rgba(240,180,41,0.2);}

/* ── DIVIDER ── */
.divider{height:1px;background:var(--border-subtle);margin:1.5rem 0;}

/* ── EMPTY ── */
.empty{text-align:center;padding:3rem 1rem;color:var(--text-muted);font-size:13px;border:1px dashed var(--border-subtle);border-radius:var(--radius-lg);}
.empty-icon{font-size:32px;margin-bottom:10px;opacity:0.4;}

/* ── LOADING ── */
.spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(45,124,246,0.2);border-top-color:var(--brand-blue);border-radius:50%;animation:spin 0.65s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-state{display:flex;align-items:center;gap:10px;color:var(--text-muted);font-size:13px;padding:1.5rem 0;}

/* ── MEMBER CARD ── */
.member-card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:1rem 1.25rem;display:flex;align-items:flex-start;gap:14px;margin-bottom:10px;transition:all var(--transition);position:relative;overflow:hidden;}
.member-card:hover{border-color:var(--border-soft);background:var(--bg-elevated);}
.member-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad-brand-v);opacity:0;transition:opacity var(--transition);}
.member-card:hover::before{opacity:1;}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--bg-elevated);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--brand-blue);flex-shrink:0;overflow:hidden;position:relative;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.avatar-ring{position:absolute;inset:-2px;border-radius:50%;background:var(--grad-brand);z-index:-1;opacity:0;transition:opacity var(--transition);}
.member-card:hover .avatar{border-color:transparent;}
.member-card:hover .avatar-ring{opacity:1;}
.member-info{flex:1;min-width:0;}
.member-name{font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--text-primary);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.member-badges{display:flex;flex-wrap:wrap;gap:5px;}
.member-actions{display:flex;gap:6px;flex-shrink:0;align-self:center;}

/* ── FOTO UPLOAD ── */
.foto-upload{border:1.5px dashed var(--border-medium);border-radius:var(--radius-lg);padding:1.25rem;text-align:center;cursor:pointer;transition:all var(--transition);position:relative;background:var(--bg-elevated);}
.foto-upload:hover{border-color:var(--brand-blue);background:var(--brand-glow);}
.foto-upload input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.foto-upload-icon{font-size:26px;margin-bottom:6px;opacity:0.5;}
.foto-upload-text{font-size:12px;color:var(--text-muted);}
.foto-upload-hint{font-size:11px;color:var(--text-muted);margin-top:3px;opacity:0.6;}
.foto-preview-img{width:72px;height:72px;border-radius:50%;object-fit:cover;margin:0 auto 8px;display:block;border:2px solid var(--brand-blue);box-shadow:var(--shadow-glow);}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(5,8,16,0.8);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;animation:overlayIn 0.2s ease;}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg-surface);border:1px solid var(--border-soft);border-radius:var(--radius-xl);padding:1.5rem;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;animation:modalIn 0.25s cubic-bezier(0.34,1.56,0.64,1);position:relative;}
.modal::before{content:'';position:absolute;top:0;left:24px;right:24px;height:1px;background:var(--grad-brand);opacity:0.5;}
@keyframes modalIn{from{opacity:0;transform:scale(0.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;}
.modal-title{font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--text-primary);}
.modal-close{background:var(--bg-elevated);border:1px solid var(--border-soft);color:var(--text-secondary);width:30px;height:30px;border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all var(--transition);}
.modal-close:hover{color:var(--text-primary);border-color:var(--border-medium);}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--border-subtle);}

/* ── ESCALA ── */
.slot-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-subtle);}
.slot-row:last-child{border-bottom:none;}
.slot-label{min-width:150px;}
.escala-card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:1.25rem 1.5rem;margin-bottom:10px;transition:border-color var(--transition);position:relative;overflow:hidden;}
.escala-card:hover{border-color:var(--border-soft);}
.escala-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--grad-brand);opacity:0;transition:opacity var(--transition);}
.escala-card:hover::after{opacity:1;}
.escala-head{display:flex;align-items:center;gap:10px;margin-bottom:1rem;flex-wrap:wrap;}
.escala-date{font-family:var(--font-display);font-size:17px;font-weight:700;color:var(--brand-light);}
.escala-evento{font-size:12px;color:var(--text-secondary);background:var(--bg-elevated);border:1px solid var(--border-subtle);padding:3px 10px;border-radius:var(--radius-full);}
.escala-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;}
.escala-slot-item{background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:9px 12px;display:flex;align-items:center;gap:10px;}
.slot-avatar{width:30px;height:30px;border-radius:50%;background:var(--bg-surface);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--brand-blue);flex-shrink:0;overflow:hidden;}
.slot-avatar img{width:100%;height:100%;object-fit:cover;}
.slot-role{font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:1px;}
.slot-name{font-size:13px;font-weight:500;color:var(--text-primary);}

/* ── SUBS ── */
.subs-card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:1rem 1.25rem;margin-bottom:10px;}
.subs-role-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.subs-names{display:flex;flex-wrap:wrap;gap:6px;}
.subs-name{font-size:12px;padding:4px 12px;border-radius:var(--radius-full);background:var(--bg-elevated);border:1px solid var(--border-soft);color:var(--text-primary);}
.subs-none{font-size:13px;color:var(--text-muted);font-style:italic;}

/* ── TOAST ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg-elevated);border:1px solid var(--border-medium);color:var(--text-primary);font-size:13px;font-weight:500;padding:11px 20px;border-radius:var(--radius-full);z-index:999;transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);pointer-events:none;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-lg);white-space:nowrap;}
.toast::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--brand-cyan);flex-shrink:0;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.error::before{background:var(--danger);}
.toast.error{border-color:rgba(240,82,82,0.3);}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg-base);}
::-webkit-scrollbar-thumb{background:var(--border-medium);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--border-strong);}
@media(max-width:600px){
  .container{padding:1rem;}
  .app-header{padding:0 1rem;}
  .nav-btn span{display:none;}
  .member-actions{flex-direction:column;}
  .form-row{flex-direction:column;}
  .user-chip-name{display:none;}
}
</style>
</head>
<body>

<!-- ═══════════════ TELA DE LOGIN ═══════════════ -->
<div class="auth-page" id="page-login">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="auth-logo-icon">🎵</div>
      <div class="auth-logo-text">Praizy</div>
      <div class="auth-logo-sub">Gestão de músicos e ministérios</div>
    </div>
    <div class="auth-card">
      <div class="auth-title">Entrar na conta</div>
      <div class="auth-subtitle">Bem-vindo de volta! Faça login para continuar.</div>

      <div class="form-group">
        <label class="form-label">E-mail</label>
        <input class="form-input" type="email" id="login-email" placeholder="seu@email.com" autocomplete="email"/>
        <div class="form-error" id="login-email-err"></div>
      </div>
      <di
